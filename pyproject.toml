[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pi-agent-python"
version = "0.1.0"
description = "A Python reimplementation of Pi Agent's stateful tool-calling runtime"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Pi Agent Python contributors" }]
keywords = ["ai", "agent", "llm", "tools", "coding-agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.scripts]
pi-agent-py = "pi_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

